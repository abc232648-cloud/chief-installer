name: Chief Unified Installer CI

on:
  push:
    branches:
      - main
      - 'installer/**'
      - 'security/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout chief-installer
        uses: actions/checkout@v4

      - name: Checkout chief-agent peer repository at pinned manifest commit
        run: |
          git clone https://github.com/abc232648-cloud/chief-agent.git ../chief-agent
          git -C ../chief-agent checkout 89abfd22705ec331dd9f33a133a59ec9473513aa
          test "$(git -C ../chief-agent rev-parse HEAD)" = "89abfd22705ec331dd9f33a133a59ec9473513aa" || exit 1
        shell: bash

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3 argon2-cffi cryptography

      - name: Run installer test suite
        run: |
          pytest -v

  package-linux:
    name: Linux Package Build & Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout chief-installer
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build self-contained Linux installer package
        run: |
          python packaging/installer/linux/build_package.py

      - name: Verify package executable and checksums
        run: |
          test -f dist/installer/linux/chief-installer
          test -x dist/installer/linux/chief-installer
          test -f dist/installer/linux/INSTALLER_SHA256.json
          python -c "
          import json, hashlib
          with open('dist/installer/linux/INSTALLER_SHA256.json') as f:
              meta = json.load(f)
          with open('dist/installer/linux/chief-installer', 'rb') as f:
              actual_sha = hashlib.sha256(f.read()).hexdigest()
          assert actual_sha == meta['sha256'], f'Checksum mismatch: {actual_sha} vs {meta[\"sha256\"]}'
          print('Package verification passed: SHA-256 matches.')
          "

      - name: Run packaged executable help test
        run: |
          ./dist/installer/linux/chief-installer --help

      - name: Run packaged artifact acceptance test suite
        run: |
          pytest tests/test_packaged_linux_acceptance.py -v

      - name: Run Linux packaged artifact qualification script
        run: |
          bash packaging/installer/linux/run_xubuntu_acceptance.sh

      - name: Upload verified Linux release candidate
        uses: actions/upload-artifact@v4
        with:
          name: chief-installer-linux-rc
          path: dist/installer/linux/
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Windows Package Build & Verification
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout chief-installer
        uses: actions/checkout@v4

      - name: Checkout chief-agent peer repository at pinned manifest commit
        run: |
          git clone https://github.com/abc232648-cloud/chief-agent.git ../chief-agent
          git -C ../chief-agent checkout 89abfd22705ec331dd9f33a133a59ec9473513aa
          test "$(git -C ../chief-agent rev-parse HEAD)" = "89abfd22705ec331dd9f33a133a59ec9473513aa" || exit 1
        shell: bash

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3 argon2-cffi cryptography

      - name: Build self-contained Windows installer executable (.exe)
        run: |
          python packaging/installer/windows/build_package.py

      - name: Verify Windows executable format and checksums
        shell: bash
        run: |
          test -f dist/installer/windows/Chief-Installer-Windows.exe
          test -f dist/installer/windows/Chief-Installer-Windows.exe.sha256
          test -f dist/installer/windows/INSTALLER_SHA256.json
          python -c "
          import json, hashlib
          with open('dist/installer/windows/INSTALLER_SHA256.json') as f:
              meta = json.load(f)
          with open('dist/installer/windows/Chief-Installer-Windows.exe', 'rb') as f:
              data = f.read()
              assert data[:2] == b'MZ', f'Header mismatch: {data[:2]!r}'
              actual_sha = hashlib.sha256(data).hexdigest()
          assert actual_sha == meta['sha256'], f'Checksum mismatch: {actual_sha} vs {meta[\"sha256\"]}'
          print('Windows PE verification passed: MZ header valid, SHA-256 matches.')
          "

      - name: Run Windows packaged executable help verification
        run: |
          .\dist\installer\windows\Chief-Installer-Windows.exe --help

      - name: Run Windows acceptance test suite
        run: |
          pytest tests/test_installer_windows.py tests/test_packaged_windows_acceptance.py -v

      - name: Run Windows packaged artifact qualification script
        run: |
          python packaging/installer/windows/run_windows_acceptance.py

      - name: Upload verified Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: chief-installer-windows-rc
          path: dist/installer/windows/
          if-no-files-found: error
          retention-days: 7

