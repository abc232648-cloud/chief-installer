name: Chief Installer scoped DNS review

on:
  push:
    branches: ['security/chief-scoped-dns']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout chief-installer DNS review branch
        uses: actions/checkout@v4

      - name: Checkout exact chief-agent DNS review commit
        run: |
          git clone https://github.com/abc232648-cloud/chief-agent.git ../chief-agent
          git -C ../chief-agent checkout 96aacadf8e111fb2c108c49d0d49fac40aea47e3

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install argon2-cffi cryptography

      - name: Run full installer suite
        run: pytest -v
